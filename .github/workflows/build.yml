name: Build Windows release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run offline checks
        shell: pwsh
        run: ./build-release.ps1
      - name: Check simulated multi-device tray behavior
        shell: pwsh
        run: |
          dotnet build src/VgnBattery.csproj -c Release -p:DefineConstants=UI_QA -o artifacts/qa --nologo
          if ($LASTEXITCODE -ne 0) { throw 'QA build failed' }
          $qa = Start-Process -FilePath (Join-Path $PWD 'artifacts/qa/VgnBattery.exe') -ArgumentList '--qa-smoke' -WindowStyle Hidden -Wait -PassThru
          Get-Content artifacts/qa/qa-data/integration.txt
          Get-Content artifacts/qa/qa-data/dropdown.txt
          Get-Content artifacts/qa/qa-data/layout-checks.txt
          Get-Content artifacts/qa/qa-data/paint-checks.txt
          if ($qa.ExitCode -ne 0) { throw 'Simulated tray integration checks failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VgnBattery-win-x64
          path: |
            releases/VgnBattery-*-win-x64.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
